<!doctype html><meta charset="utf-8"><title>m</title><pre id="o"></pre>
<script>
const img = new Image(); img.src = '../img/legacy/upgrade.png';
img.onload = () => {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data, out = [];
  for (let y = 0; y < c.height; y += 6) {
    const runs = []; let s = -1;
    for (let i = 0; i <= c.width; i++) {
      const a = i < c.width ? d[(y * c.width + i) * 4 + 3] : 0;
      if (a > 128 && s < 0) s = i; if (a <= 128 && s >= 0) { runs.push(s + '-' + (i - 1)); s = -1; }
    }
    out.push(y + ': ' + runs.join(' '));
  }
  document.getElementById('o').textContent = out.join('\n'); document.title = 'done';
};
</script>
