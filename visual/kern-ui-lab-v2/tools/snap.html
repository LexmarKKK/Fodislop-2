<!doctype html>
<!-- Обвязка снимков: ?page=<путь к макету>&do=<вызовы через ;>
     Грузит макет во фрейме на весь экран и выполняет его же функции
     (switchViewState, openModal ...) — сам макет для снимка не меняется. -->
<html><head><meta charset="utf-8"><style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
const p = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.onload = () => {
  const w = f.contentWindow;
  try { w.localStorage.clear(); } catch (e) {}
  setTimeout(() => {
    for (const call of (p.get('do') || '').split(';').filter(Boolean)) {
      try { w.eval(call); } catch (e) { w.document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;left:0;top:0;z-index:99999;background:red;color:#fff;font:12px monospace">SNAP ERROR: ${call}: ${e.message}</div>`); }
    }
    // Доиграть переходы и анимации появления: снимок — конечное состояние
    const settle = () => { try { w.document.getAnimations().forEach(x => { try { x.finish(); } catch (e) {} }); } catch (e) {} };
    settle(); setTimeout(settle, 400); setTimeout(settle, 900);
  }, 300);
};
f.src = p.get('page');
</script></body></html>
